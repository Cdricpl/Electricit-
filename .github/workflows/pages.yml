name: Déployer sur GitHub Pages

on:
  push:
    branches: ["claude/gsm-installation-2wop8x"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages doit être activé une fois à la main :
      # Settings -> Pages -> Source : GitHub Actions.
      # (enablement: true ne passe pas — le GITHUB_TOKEN du workflow n'a pas le
      # droit de créer le site Pages sur ce dépôt.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
